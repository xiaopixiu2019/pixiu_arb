name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - id: scope
        run: node scripts/ci/ci-scope.mjs
  quality:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Require successful scope check
        env:
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE_FULL: ${{ needs.scope.outputs.full }}
        run: node -e "if (process.env.CI_SCOPE_RESULT !== 'success' || !['true', 'false'].includes(process.env.CI_SCOPE_FULL)) throw new Error('CI scope check failed')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.full == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.scope.outputs.full == 'true'
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci --no-audit --no-fund
        if: needs.scope.outputs.full == 'true'
      - run: npm run lint
        if: needs.scope.outputs.full == 'true'
      - run: npm run typecheck
        if: needs.scope.outputs.full == 'true'
      - run: npm test
        if: needs.scope.outputs.full == 'true'
      - run: npm run test:bootstrap
        if: needs.scope.outputs.full == 'true'
      - run: npm run test:release
        if: needs.scope.outputs.full == 'true'
      - run: npm run test:ci
        if: needs.scope.outputs.full == 'true'
      - run: npm run build
        if: needs.scope.outputs.full == 'true'
  platform:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.scope.outputs.full == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: windows-2025
            node: 24
    steps:
      - name: Require successful scope check
        env:
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE_FULL: ${{ needs.scope.outputs.full }}
        run: node -e "if (process.env.CI_SCOPE_RESULT !== 'success' || !['true', 'false'].includes(process.env.CI_SCOPE_FULL)) throw new Error('CI scope check failed')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.full == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.scope.outputs.full == 'true'
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci --no-audit --no-fund
        if: needs.scope.outputs.full == 'true'
      - run: npm run typecheck
        if: needs.scope.outputs.full == 'true'
      - run: npm test
        if: needs.scope.outputs.full == 'true'
      - run: npm run test:bootstrap
        if: needs.scope.outputs.full == 'true'
      - run: npm run test:release
        if: needs.scope.outputs.full == 'true'
      - run: npm run test:ci
        if: needs.scope.outputs.full == 'true'
      - run: npm run build
        if: needs.scope.outputs.full == 'true'
  e2e:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful scope check
        env:
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE_FULL: ${{ needs.scope.outputs.full }}
        run: node -e "if (process.env.CI_SCOPE_RESULT !== 'success' || !['true', 'false'].includes(process.env.CI_SCOPE_FULL)) throw new Error('CI scope check failed')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.full == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.scope.outputs.full == 'true'
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
        if: needs.scope.outputs.full == 'true'
      - run: npx playwright install --with-deps chromium
        if: needs.scope.outputs.full == 'true'
      - run: npm run test:e2e
        if: needs.scope.outputs.full == 'true'
      - name: Upload Playwright diagnostics
        if: failure() && needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: error
          retention-days: 7
  dependencies:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful scope check
        env:
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SCOPE_FULL: ${{ needs.scope.outputs.full }}
        run: node -e "if (process.env.CI_SCOPE_RESULT !== 'success' || !['true', 'false'].includes(process.env.CI_SCOPE_FULL)) throw new Error('CI scope check failed')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.full == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.scope.outputs.full == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
        if: needs.scope.outputs.full == 'true'
      - run: npm audit --audit-level=high
        if: needs.scope.outputs.full == 'true'
